[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oauth-flow-gemini-enterprise-secops-mcp"
version = "0.1.0"
description = "Google SecOps Remote MCP ADK Agent with Gemini Enterprise OAuth Passthrough"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Dan Dye", email = "dandye@google.com" }
]
dependencies = [
  "gcsfs>=2024.11.0",
  "google-adk>=2.0.0",
  "google-auth-oauthlib>=1.2.0",
  "google-cloud-aiplatform[agent-engines,evaluation]>=1.130.0",
  "google-cloud-logging>=3.12.0",
  "google-cloud-secret-manager>=2.18.0",
  "google-cloud-storage>=2.14.0",
  "httpx>=0.27.0",
  "mcp>=1.0.0",
  "opentelemetry-api>=1.20.0",
  "opentelemetry-exporter-gcp-logging>=1.6.0a0",
  "opentelemetry-instrumentation-google-genai>=0.1.0",
  "opentelemetry-sdk>=1.20.0",
  "protobuf>=6.31.1,<7.0.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "rich>=13.0.0",
  "typer>=0.12.0",
]

[dependency-groups]
dev = [
  "pyink>=24.3.0",
  "pytype>=2024.10.11",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]
gcp = [
  "google-cloud-aiplatform>=1.130.0",
  "google-cloud-secret-manager>=2.18.0",
  "google-cloud-storage>=2.14.0",
]

[project.scripts]
oauth-flow-gemini-enterprise-secops-mcp = "oauth_flow_gemini_enterprise_secops_mcp.cli:app"

[tool.hatch.build.targets.wheel]
packages = [
  "src/oauth_flow_gemini_enterprise_secops_mcp",
  "secops_agent",
]

[tool.pyink]
line-length = 80
target-version = ["py311"]
pyink-indentation = 2
pyink-use-majority-quotes = true
extend-exclude = "/(external)/"

[tool.pytype]
inputs = ["src"]
exclude = ["src/oauth_flow_gemini_enterprise_secops_mcp/installation_scripts"]
disable = ["import-error"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 80
indent-width = 2
target-version = "py311"
exclude = [
  ".git",
  ".gcloud",
  ".venv",
  "venv",
  "build",
  "dist",
  "__pycache__",
  "external",
  "src/oauth_flow_gemini_enterprise_secops_mcp/installation_scripts",
  "secops_agent",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "D",    # pydocstyle (Google docstrings)
  "G",    # flake8-logging-format (enforces %s, bans f-strings in logging per §3.10.1)
  "S",    # bandit security checks
]
ignore = [
  "E501",  # line too long (handled by pyink formatter)
  "D100",  # missing docstring in public module
  "D104",  # missing docstring in public package
  "D107",  # missing docstring in __init__
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D101", "D102", "D103"]
"scripts/**/*.py" = ["S603", "S607"]

[tool.ruff.lint.isort]
force-single-line = true
