name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test & Lint (oauth_flow_gemini_enterprise_secops_mcp)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12 --all-groups --frozen

      - name: Format Check (Pyink - Google Style)
        run: uv run pyink --check --diff .

      - name: Lint Check (Ruff - Google Style)
        run: uv run ruff check .

      - name: Static Type Analysis (Pytype)
        env:
          PATH: ${{ github.workspace }}/.venv/bin:${{ env.PATH }}
        run: uv run pytype src

      - name: Run Pytest with Coverage
        run: uv run pytest --cov=src --cov-report=term-missing
